<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="band-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg-grad)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(249, 115, 22, 0.1)" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Outer Sound Waves -->
  <path d="M 80,180 A 130 130 0 0 1 80,240" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M 65,160 A 160 160 0 0 1 65,260" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.3" />
  <path d="M 320,180 A 130 130 0 0 0 320,240" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M 335,160 A 160 160 0 0 0 335,260" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.3" />

  <!-- Headband Arc -->
  <path d="M 120,210 C 120,95 280,95 280,210" fill="none" stroke="url(#band-grad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
  <!-- Inner Cushion Arc -->
  <path d="M 134,195 C 134,120 266,120 266,195" fill="none" stroke="#3f3f46" stroke-width="6" stroke-linecap="round" />

  <!-- Left Cup Assembly -->
  <g>
    <!-- Pivot arm -->
    <rect x="112" y="195" width="16" height="30" rx="4" fill="#52525b" />
    <!-- Outer Cup -->
    <rect x="100" y="210" width="40" height="74" rx="20" fill="url(#cup-grad)" stroke="#f97316" stroke-width="3" filter="url(#glow)" />
    <!-- Inner Cushion -->
    <rect x="122" y="218" width="14" height="58" rx="7" fill="#3f3f46" />
    <circle cx="116" cy="247" r="8" fill="#f97316" opacity="0.8" />
  </g>

  <!-- Right Cup Assembly -->
  <g>
    <!-- Pivot arm -->
    <rect x="272" y="195" width="16" height="30" rx="4" fill="#52525b" />
    <!-- Outer Cup -->
    <rect x="260" y="210" width="40" height="74" rx="20" fill="url(#cup-grad)" stroke="#f97316" stroke-width="3" filter="url(#glow)" />
    <!-- Inner Cushion -->
    <rect x="264" y="218" width="14" height="58" rx="7" fill="#3f3f46" />
    <circle cx="284" cy="247" r="8" fill="#f97316" opacity="0.8" />
  </g>

  <!-- ANC Badge -->
  <g transform="translate(155, 295)">
    <rect width="90" height="26" rx="13" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316" stroke-width="1.5" />
    <text x="45" y="17" fill="#f97316" font-size="11" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="1">ANC HI-FI</text>
  </g>
</svg>
