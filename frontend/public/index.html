<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/ShopNestLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Full-Stack MERN E-Commerce Platform" />
  <meta property="og:title" content="ShopNest" />
  <meta property="og:description" content="Full-Stack MERN E-Commerce Platform" />
  <title>ShopNest</title>
  <script>
    (function() {
      try {
        var currentFetch = window.fetch ? window.fetch.bind(window) : null;
        Object.defineProperty(window, 'fetch', {
          get: function() {
            return currentFetch;
          },
          set: function(fn) {
            currentFetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        try {
          var origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            value: origFetch,
            writable: true,
            configurable: true,
            enumerable: true
          });
        } catch (err) {}
      }
    })();
  </script>
  <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
</head>

<body>

  <div id="root"></div>
</body>

</html>
